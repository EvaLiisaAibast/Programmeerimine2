xt-anchor="start" font-size="13" font-family="Segoe UI, Arial, sans-serif" fill="#000000">viitab</text><text x="712" y="368" text-anchor="start" font-size="13" font-weight="bold" font-family="Segoe UI, Arial, sans-serif" fill="#000000">1</text><path d="M 60 430 L 456 430 L 480 454 L 480 690 L 60 690 Z" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><path d="M 456 430 L 456 454 L 480 454 Z" fill="#e6d190" stroke="#d6b656" stroke-width="1"/><text x="72" y="456" text-anchor="start" font-size="12.5" font-weight="bold" font-family="Segoe UI, Arial, sans-serif" fill="#000000">Reeglid (lühidalt):</text><text x="72" y="476" text-anchor="start" font-size="12.5" font-family="Segoe UI, Arial, sans-serif" fill="#000000">1. TellimuseNr = eelmine TellimuseNr + 1</text><text x="72" y="496" text-anchor="start" font-size="12.5" font-family="Segoe UI, Arial, sans-serif" fill="#000000">2. Tellimuse reale salvestatakse toote nimi</text><text x="72" y="516" text-anchor="start" font-size="12.5" font-family="Segoe UI, Arial, sans-serif" fill="#000000">    ja hetke hind (TooteNimetus, Ühikuhind)</text><text x="72" y="536" text-anchor="start" font-size="12.5" font-family="Segoe UI, Arial, sans-serif" fill="#000000">3. TellimuseRida.Summa = Ühikuhind * Kogus</text><text x="72" y="556" text-anchor="start" font-size="12.5" font-family="Segoe UI, Arial, sans-serif" fill="#000000">4. Tellimus.Summa = ridade summa</text><text x="72" y="576" text-anchor="start" font-size="12.5" font-family="Segoe UI, Arial, sans-serif" fill="#000000">5. Toote.Hind &gt;= 0; Kogus &gt; 0</text><text x="72" y="596" text-anchor="start" font-size="12.5" font-family="Segoe UI, Arial, sans-serif" fill="#000000">6. Makstud &gt;= TellimiseKuupäev; Saadetud &gt;= Makstud;</text><text x="72" y="616" text-anchor="start" font-size="12.5" font-family="Segoe UI, Arial, sans-serif" fill="#000000">    KätteToimetatud &gt;= Saadetud</text><text x="72" y="636" text-anchor="start" font-size="12.5" font-family="Segoe UI, Arial, sans-serif" fill="#000000">7. Lähetada saab ainult pärast maksmist</text><text x="72" y="656" text-anchor="start" font-size="12.5" font-family="Segoe UI, Arial, sans-serif" fill="#000000">8. Tellimusel peab olema vähemalt üks rida</text></svg>